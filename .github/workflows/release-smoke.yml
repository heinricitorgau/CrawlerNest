name: Release Smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    name: Smoke (Spring Boot compile + Next.js build + Python syntax)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: crawlernest/crawlernest-web/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Install frontend dependencies
        working-directory: crawlernest/crawlernest-web
        run: npm ci

      - name: Make Maven wrapper executable
        run: chmod +x crawlernest/servise_for_java/mvnw

      - name: Run smoke_release.sh
        run: bash scripts/smoke_release.sh
