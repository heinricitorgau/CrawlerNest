name: Release Snapshot Verification

on:
  push:
    branches: ["main"]
    paths:
      - "docs/releases/**"
      - "scripts/restore_release_snapshot.sh"
      - "scripts/release_snapshot.py"
      - ".github/workflows/release-snapshot.yml"
  pull_request:
    paths:
      - "docs/releases/**"
      - "scripts/restore_release_snapshot.sh"
      - "scripts/release_snapshot.py"
      - ".github/workflows/release-snapshot.yml"
  workflow_dispatch:

jobs:
  restore-and-verify:
    name: Restore ${{ matrix.release }}
    # Pinned: the dumps are PostgreSQL 16 archives, and ubuntu-latest moved to an image without postgresql-client-16.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ["v0.2-2026-snapshot", "v0.3-multi-year-snapshot", "v0.3.1-qs-2017-relabel"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clawer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d clawer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client-16

      - name: Restore and verify frozen database
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test
          PGPASSWORD: test
          PGDATABASE: clawer
          RELEASE_DIR: docs/releases/${{ matrix.release }}
        run: ./scripts/restore_release_snapshot.sh