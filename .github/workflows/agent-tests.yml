name: Agent Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ds4-agent-tests:
    name: ds4 / web-agent generation tests (offline, no GPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The web-agent generation layer + ds4 integration. All offline: the
      # live-path test drives a real HTTP round-trip against a mock
      # OpenAI-compatible server, so no GPU and no ds4-server are needed.
      - name: Run ds4 / generation-layer tests
        env:
          PYTHONPATH: .
        run: |
          pytest \
            crawlernest/crawlernest-tests/test_ds4_recommendation_explainer.py \
            crawlernest/crawlernest-tests/test_ds4_ranking_explainer.py \
            crawlernest/crawlernest-tests/test_ds4_university_lookup_explainer.py \
            crawlernest/crawlernest-tests/test_ds4_data_query_explainer.py \
            crawlernest/crawlernest-tests/test_ds4_live_path_mock_server.py \
            crawlernest/crawlernest-tests/test_intent_detection.py \
            crawlernest/crawlernest-tests/test_context_builder_summary_facts.py \
            crawlernest/crawlernest-tests/test_prompt_builder_instruction.py \
            crawlernest/crawlernest-tests/test_faithfulness.py \
            crawlernest/crawlernest-tests/test_explanation_verification.py \
            crawlernest/crawlernest-tests/test_provenance.py \
            crawlernest/crawlernest-tests/test_agent_api_stats.py \
            crawlernest/crawlernest-tests/test_agent_api_explain.py \
            crawlernest/crawlernest-tests/test_agent_api_sse_stream.py \
            crawlernest/crawlernest-tests/test_ds4_comparison_and_plan_explainers.py \
            crawlernest/crawlernest-tests/test_dataset_context.py \
            crawlernest/crawlernest-tests/test_ml_tools.py \
            crawlernest/crawlernest-tests/test_caveat_contract.py \
            crawlernest/crawlernest-tests/test_unsupported_year_warning.py \
            crawlernest/crawlernest-tests/test_two_pass_constraints.py \
            -q

      # Mechanical faithfulness eval over the golden dataset: verifies the
      # checker still catches fabricated numbers, dropped caveats, and invented
      # institutions. Fixture mode needs no model.
      - name: Run faithfulness eval (fixture mode)
        env:
          PYTHONPATH: .
        run: |
          python crawlernest/crawlernest-autoeval/runners/run_faithfulness_eval.py
