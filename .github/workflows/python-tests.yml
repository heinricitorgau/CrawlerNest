name: Python Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly on Monday at 05:00 UTC. Scheduled as well as on-push because these
    # tests have a history of failing with time: a cache fixture with a hardcoded
    # timestamp aged past its TTL and went red for three months. A cron run
    # catches that class of decay on a repository nobody is pushing to.
    - cron: "0 5 * * 1"

jobs:
  python-tests:
    name: crawlernest-tests (fixture mode — no live DB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite skips its PostgreSQL and live-HTTP tests unless opted into, so
      # this job needs no services and stays fast. The PostgreSQL half runs in
      # the job below.
      - name: Run the test suite
        run: python crawlernest/crawlernest-tests/run_tests.py

      # These check the pipeline entry point and the modules extracted from it.
      # They import every command module, so a move that dropped a dependency
      # fails here rather than in a command a user happens to run.
      - name: Pipeline name resolution
        run: python scripts/check_pipeline_names.py

  postgres-tests:
    name: crawlernest-tests (PostgreSQL — opt-in tests)
    runs-on: ubuntu-latest

    # Without this job the opt-in tests were coverage on paper only: they need a
    # database, nothing in CI provided one, and skipping is not a failure -- so a
    # green run said nothing about the warehouse write path. The superseded-row
    # prune in particular guards a defect that raises nothing and breaks no
    # constraint, which is exactly the kind that needs a machine to notice.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clawer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Schemas only -- no ranking data is loaded. The tests that need rows
      # create and remove their own, so they do not depend on what a crawl
      # happens to have left behind.
      - name: Bootstrap PostgreSQL schemas
        run: |
          python -m crawlernest.run_pipeline bootstrap-postgres \
            --pg-user test --pg-password test --pg-database clawer

      - name: Run the test suite with PostgreSQL enabled
        env:
          CRAWLERNEST_RUN_PG_TESTS: "1"
          CRAWLERNEST_PG_HOST: localhost
          CRAWLERNEST_PG_PORT: "5432"
          CRAWLERNEST_PG_DATABASE: clawer
          CRAWLERNEST_PG_USER: test
          CRAWLERNEST_PG_PASSWORD: test
        run: python crawlernest/crawlernest-tests/run_tests.py
