name: ML Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ml-metrics:
    name: feature tests and metrics regression gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The MATLAB freshness guard compares commit timestamps for
          # matlab/*.m against artifacts/eda_matlab/. A shallow clone has
          # neither in its history, and the guard would report "cannot tell"
          # rather than silently passing.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt
          pip install pytest

      # Fast, no database, no training. These guard the assumptions the models
      # rest on -- matrix shape, the 600/903 publication split, region coverage,
      # value parsing -- so a broken feature layer fails here rather than
      # surfacing as an unexplained metric movement two steps later.
      - name: Feature-layer tests
        env:
          PYTHONPATH: crawlernest/crawlernest-ml
        run: pytest crawlernest/crawlernest-ml/tests -q

      # Two implementations that disagree are not a redundancy, they are a bug
      # in one of them and nobody knows which. This compares the committed
      # MATLAB artifacts against a fresh Python run at 1e-9. It needs no MATLAB
      # on the runner, because the MATLAB side is committed output -- which is
      # also its limit, and why the matlab-reexecution job below exists. Kept
      # here because it is fast and catches Python-side drift on every push.
      - name: MATLAB port parity
        env:
          PYTHONPATH: crawlernest/crawlernest-ml
        run: python -m ranking_ml.evaluation.check_matlab_parity

      # The training scripts overwrite artifacts/metrics/*.json in place, so the
      # committed files have to be copied aside before they are clobbered. Those
      # copies are the baseline; what training writes is the candidate.
      - name: Stash the committed metrics as the baseline
        run: |
          mkdir -p /tmp/metrics-baseline
          cp crawlernest/crawlernest-ml/artifacts/metrics/*.json /tmp/metrics-baseline/
          ls -l /tmp/metrics-baseline

      # Everything trains from the committed crawl snapshot, so no database and
      # no network are involved.
      - name: Retrain both models
        env:
          PYTHONPATH: crawlernest/crawlernest-ml
        run: |
          python -m ranking_ml.training.train_overall_score
          python -m ranking_ml.training.train_disagreement

      # A model has no compiler and no failing test to say it broke. Without
      # this, a change that quietly costs three points of AUC looks exactly like
      # a change that costs nothing.
      - name: Metrics regression gate
        env:
          PYTHONPATH: crawlernest/crawlernest-ml
        run: python -m ranking_ml.evaluation.check_metrics --baseline-dir /tmp/metrics-baseline

      # Informational: shows whether the numbers moved within tolerance, which
      # is the cue to recommit the metrics files. Not a failure on its own --
      # only regressions fail, above.
      - name: Report metric drift within tolerance
        if: always()
        run: |
          if git diff --quiet -- crawlernest/crawlernest-ml/artifacts/metrics/; then
            echo "Committed metrics match this run exactly."
          else
            echo "Metrics moved within tolerance. Diff:"
            git --no-pager diff -- crawlernest/crawlernest-ml/artifacts/metrics/
            echo
            echo "If this is a deliberate improvement, retrain locally and commit the updated files."
          fi

  ml-serving:
    name: serving write path (throwaway PostgreSQL)
    runs-on: ubuntu-latest

    # The training jobs above need no database. This one exists because the
    # write path -- resolve names to canonical ids, insert a run, insert its
    # predictions -- had no coverage at all: the metrics gate stops at the model.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clawer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d clawer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: crawlernest/crawlernest-ml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The MATLAB freshness guard compares commit timestamps for
          # matlab/*.m against artifacts/eda_matlab/. A shallow clone has
          # neither in its history, and the guard would report "cannot tell"
          # rather than silently passing.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ml.txt

      - name: Create the schema
        run: |
          python -m crawlernest.run_pipeline bootstrap-postgres \
            --pg-user test --pg-password test --pg-database clawer

      # The serving jobs resolve names against warehouse.canonical_university,
      # which the pipeline normally fills by crawling. This fills it from the
      # committed snapshot instead, so the write path can be exercised without a
      # network round trip.
      - name: Seed canonical universities from the snapshot
        run: |
          python -m ranking_ml.serving.seed_canonical_from_snapshot \
            --pg-user test --pg-password test --pg-database clawer

      - name: Write the overall-score estimates
        run: |
          python -m ranking_ml.serving.predict \
            --pg-user test --pg-password test --pg-database clawer

      - name: Write the disagreement probabilities
        run: |
          python -m ranking_ml.serving.predict_disagreement \
            --pg-user test --pg-password test --pg-database clawer

      # Exit 0 from the jobs above only means they did not crash. This checks the
      # rows: both targets present, each value on the scale its target implies,
      # disclosure columns intact, and nothing leaked into the published table.
      - name: Verify what was written
        run: |
          python -m ranking_ml.serving.verify_predictions \
            --pg-user test --pg-password test --pg-database clawer

      # Re-running must replace cleanly rather than accumulate: the API reads
      # "latest per target", so a second run that leaves both visible would show
      # two models at once.
      - name: Re-run both jobs and verify again
        run: |
          python -m ranking_ml.serving.predict \
            --pg-user test --pg-password test --pg-database clawer
          python -m ranking_ml.serving.predict_disagreement \
            --pg-user test --pg-password test --pg-database clawer
          python -m ranking_ml.serving.verify_predictions \
            --pg-user test --pg-password test --pg-database clawer

      # verify_predictions checks the shape of the rows; every way a model can
      # silently become useless produces rows of exactly the right shape. This
      # scores them against the published data they can be checked against --
      # rank order for the overall score, observed disagreement for the
      # probabilities -- which is the only part of the ML chain that had no
      # guard at all.
      - name: Score the served predictions
        run: |
          python -m ranking_ml.serving.check_serving_quality \
            --pg-user test --pg-password test --pg-database clawer

  matlab-reexecution:
    name: MATLAB sources re-executed (public-repo runner)
    runs-on: ubuntu-latest

    # Until the repository was public this could not exist: MathWorks' free
    # GitHub-hosted MATLAB covers public repositories only, so CI could compare
    # the *committed* MATLAB output against Python but never re-run the sources
    # that produced it. The gap that left is narrow and real -- edit a .m file,
    # do not re-run it, and the parity check happily compares against output the
    # sources no longer produce. check_artifacts_are_current asks git about
    # commit ordering, which catches the ordinary mistake but proves nothing
    # about the numbers.
    #
    # This job closes it by executing the sources and comparing what they
    # produce, both against Python and against what is committed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The freshness guard inside check_matlab_parity reports "cannot tell"
          # on a shallow clone rather than passing quietly.
          fetch-depth: 0

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          # run_qs_eda.m calls pca and corr; both are Statistics and Machine
          # Learning Toolbox, not base MATLAB.
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      # Writes to a scratch directory, never over the committed artifacts, so
      # the comparison below has two independent things to compare.
      - name: Re-run run_qs_eda.m
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath("crawlernest/crawlernest-ml/matlab");
            run_qs_eda(OutDir="/tmp/eda_matlab_fresh");

      - name: Show what MATLAB produced
        run: ls -l /tmp/eda_matlab_fresh

      # --matlab-dir is the run that just happened, so the Python comparison is
      # against freshly executed sources rather than committed CSVs.
      # --committed-dir additionally asserts the two agree, which is the
      # statement the git-ordering guard could only approximate.
      - name: Parity against freshly executed sources
        env:
          PYTHONPATH: crawlernest/crawlernest-ml
        run: |
          python -m ranking_ml.evaluation.check_matlab_parity \
            --matlab-dir /tmp/eda_matlab_fresh \
            --committed-dir crawlernest/crawlernest-ml/artifacts/eda_matlab
