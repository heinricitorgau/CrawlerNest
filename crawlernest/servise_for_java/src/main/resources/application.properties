# PostgreSQL Configuration (V2/V3 AI-ready)
spring.datasource.url=jdbc:postgresql://localhost:5432/clawer
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQLite Configuration (V1.5 Legacy - Commented)
# spring.datasource.url=jdbc:sqlite:../clawer.db
# spring.datasource.driver-class-name=org.sqlite.JDBC
# spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# JSONB support is native in Hibernate 6
