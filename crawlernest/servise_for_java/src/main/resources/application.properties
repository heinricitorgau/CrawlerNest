# PostgreSQL Configuration (V2/V3 AI-ready)
# Credentials come from the environment. The defaults are the local development
# database; a deployment sets SPRING_DATASOURCE_* and nothing here applies.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clawer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:test}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=warehouse

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JSONB support is native in Hibernate 6

# Authentication: a signed token in an http-only cookie, no server-side session.
# The secret must be at least 32 bytes; unset, the service generates one per
# process and says so, so a checkout runs but nothing ships with a default key.
crawlernest.jwt.secret=${CRAWLERNEST_JWT_SECRET:}
crawlernest.jwt.ttl=${CRAWLERNEST_JWT_TTL:PT12H}
# Set true wherever the site is served over TLS, so the cookie never travels
# without it. Off by default for a plain-http local run.
crawlernest.jwt.cookie-secure=${CRAWLERNEST_JWT_COOKIE_SECURE:false}

# Browser origins allowed to call this API directly with credentials, comma
# separated. CRAWLERNEST_CORS_ALLOWED_ORIGINS overrides it; '*' is refused,
# because an API that allows credentials cannot accept every origin.
crawlernest.cors.allowed-origins=${CRAWLERNEST_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# The desk's model: essay scoring and narrative analysis. The same variables the
# Next.js agent route reads, so one setting configures both. "mock" (the default)
# means no model: those endpoints answer 503 rather than inventing output.
crawlernest.model.provider=${AGENT_MODEL_PROVIDER:mock}
crawlernest.model.model=${AGENT_MODEL_NAME:}
crawlernest.model.ds4-model=${WEB_AGENT_DS4_MODEL:deepseek-v4-flash}
crawlernest.model.base-url=${AGENT_MODEL_BASE_URL:}
crawlernest.model.ollama-base-url=${OLLAMA_BASE_URL:http://localhost:11434}
crawlernest.model.ds4-base-url=${WEB_AGENT_DS4_BASE_URL:http://localhost:8000/v1}
crawlernest.model.api-key=${OPENAI_API_KEY:}
crawlernest.model.timeout=${CRAWLERNEST_ESSAY_TIMEOUT:PT60S}
# Optional. For reasoning models: "none" turns qwen3's thinking off under Ollama
# (2 s instead of 13 s for a short answer); OpenAI's o-series take low/medium/high.
# Left blank, nothing is sent -- gpt-4.1 and most models reject the parameter.
crawlernest.model.reasoning-effort=${CRAWLERNEST_MODEL_REASONING_EFFORT:}

# "Forgot password". Where a reset link goes: "log" writes it to the server log,
# for local development only -- anyone who can read the log can use the link.
# "none" (the default) delivers nothing, so a deployment never leaks links by
# accident; a real email delivery is the next step.
crawlernest.password-reset.delivery=${CRAWLERNEST_PASSWORD_RESET_DELIVERY:none}
crawlernest.password-reset.ttl=${CRAWLERNEST_PASSWORD_RESET_TTL:PT30M}
# Links point at the site, not the API.
crawlernest.password-reset.link-base=${CRAWLERNEST_PUBLIC_BASE_URL:http://localhost:3000}
