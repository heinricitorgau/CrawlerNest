spring.datasource.url=jdbc:sqlite:../clawer.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite Dialect for Hibernate 6
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Do not modify database schema automatically
spring.jpa.hibernate.ddl-auto=none

# Show SQL queries for debugging
spring.jpa.show-sql=true

# Ignore missing tables/columns if any, though we map carefully
spring.jpa.properties.hibernate.dialect.sqlite.support_identity_columns=true
